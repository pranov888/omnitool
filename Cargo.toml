[package]
name = "omnitool"
version = "0.6.0"
edition = "2021"
authors = ["pranov888"]
description = "A fast, all-in-one developer Swiss-Army knife CLI written in Rust"
readme = "README.md"
license = "MIT"
keywords = ["cli", "developer-tools", "swiss-army-knife", "utilities", "terminal"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
colored = "2.2"
sha2 = "0.10"
md-5 = "0.10"
base64 = "0.22"
uuid = { version = "1.10", features = ["v4", "fast-rng"] }
qrcode = { version = "0.14", default-features = false }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.30"
